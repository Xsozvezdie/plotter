<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор раскроя</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1d2330;--muted:#6b7280;--line:#e3e6ea;--accent:#2563eb;--err:#b91c1c;--warn:#92400e}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}

/* три колонки на весь экран: ввод | картинка | итог */
.app{display:grid;grid-template-columns:330px minmax(0,1fr) 300px;gap:14px;height:100vh;padding:14px}
.col{min-height:0;display:flex;flex-direction:column}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.col > .card{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{overflow-y:auto;min-height:0}

h1{font-size:17px;margin:0}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.card h2{font-size:12px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.group{margin-bottom:16px}
.row{display:flex;gap:10px}
.row>label{flex:1}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:9px}
input[type=number]{width:100%;margin-top:3px;padding:8px 10px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
input[type=number]:focus{outline:2px solid var(--accent);border-color:transparent}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;padding:7px;border:0;background:#fff;font-size:14px;cursor:pointer;color:var(--text)}
.seg button.on{background:var(--accent);color:#fff}
.btn{padding:6px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;color:var(--text);white-space:nowrap}
.btn:hover{background:#f3f4f6}
.btn.add{width:100%;padding:9px;border-style:dashed;font-size:14px;color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:4px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:12px;color:var(--text)}
.chip.on{background:var(--text);color:#fff;border-color:var(--text)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);margin:0}
.hidden{display:none!important}
.partcard{border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:10px;background:#fcfcfd}
.parthead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.parthead b{flex:1;font-size:14px}
.swatch{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;flex:none}
.x{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted)}

/* картинка */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs:empty{display:none}
.tabs button{padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:13px}
.tabs button.on{background:var(--text);color:#fff;border-color:var(--text)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-bottom:8px}
.legend:empty{display:none}
.canvas{flex:1;min-height:0;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;align-items:center;justify-content:center}
svg{width:100%;height:100%;display:block}
.msg{font-weight:600;text-align:center;padding:10px}
.msg.err{color:var(--err)}
.msg.hint{color:var(--muted);font-weight:500}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.warn{font-size:13px;color:var(--warn);background:#fef3c7;border-radius:8px;padding:7px 10px;margin-top:8px}
.warn:empty{display:none}

/* итог справа */
.tiles{display:flex;flex-direction:column;gap:8px;flex:none}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-size:20px;font-weight:700;margin-top:2px}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.tile.main{border-color:var(--accent);background:#f5f8ff}
.empty{font-size:13px;color:var(--muted)}
.tablebox{flex:1;min-height:0;overflow-y:auto;margin-top:12px}
.tablebox:empty{display:none}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:var(--card)}
td small{display:block;color:var(--muted);font-size:11px}
tr.sum td{font-weight:700;background:#f8fafc}

/* узкий экран: всё друг под другом с обычной прокруткой */
@media (max-width:1000px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto}
  .canvas{height:60vh;flex:none}
  .tablebox{overflow:visible}
}
</style>
</head>
<body>
<div class="app">

  <!-- ===== ВВОД ===== -->
  <div class="col">
    <div class="card">
      <div class="cardhead"><h1>Калькулятор раскроя</h1><button class="btn" id="clearBtn" type="button">Очистить данные</button></div>
      <div class="scroll">
        <div class="group">
          <h2>Материал, мм</h2>
          <div class="seg">
            <button id="btnSheet" class="on" type="button">Лист</button>
            <button id="btnRoll" type="button">Рулон (м.п.)</button>
          </div>
          <div id="chips" class="chips"></div>
          <div class="row">
            <label id="lblL">Длина<input type="number" id="sheetL" inputmode="decimal" min="0" step="any"></label>
            <label><span id="lblWt">Ширина</span><input type="number" id="sheetW" inputmode="decimal" min="0" step="any"></label>
          </div>
          <label>Отступ от края<input type="number" id="edge" value="0" inputmode="decimal" min="0" step="any"></label>
        </div>

        <div class="group">
          <h2>Детали</h2>
          <div id="parts"></div>
          <button class="btn add" id="addPart" type="button">+ Добавить другой размер детали</button>
        </div>

        <div class="group" style="margin-bottom:0">
          <h2>Раскрой</h2>
          <label>Технический отступ между деталями, мм<input type="number" id="gap" value="3" inputmode="decimal" min="0" step="any"></label>
          <label class="check"><input type="checkbox" id="rotate" checked> Разрешить поворот на 90°</label>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== КАРТИНКА ===== -->
  <div class="col">
    <div class="card">
      <h2>Раскладка</h2>
      <div class="tabs" id="tabs"></div>
      <div class="legend" id="legend"></div>
      <div class="canvas"><div id="msg" class="msg hint"></div><svg id="svg"></svg></div>
      <div class="note" id="layoutNote"></div>
      <div class="warn" id="warn"></div>
    </div>
  </div>

  <!-- ===== ИТОГ ===== -->
  <div class="col">
    <div class="card">
      <h2>Итог</h2>
      <div class="tiles" id="totals"><div class="empty">Здесь появится расчёт</div></div>
      <div class="tablebox" id="tableBox"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   Все размеры внутри считаются в целых микрометрах (мм × 1000),
   чтобы не было ошибок округления дробных чисел.
   ========================================================= */
const U = 1000;
const toU = v => Math.round(v * U);

/* Стандартные размеры листов, мм (длина × ширина). Список можно менять. */
const SIZES = [[150, 220], [150, 100], [250, 250]];
const COLORS = ['#3b82f6', '#f97316', '#10b981', '#a855f7', '#ef4444', '#eab308', '#14b8a6', '#ec4899'];
const MAXDRAW = 6000; // максимум фигур на одной картинке

/* ---------- Раскладка одного вида деталей на листе ---------- */
function gridCount(W, L, w, h, g) {
  if (w > W || h > L || w <= 0 || h <= 0) return [0, 0];
  return [Math.floor((W - w) / (w + g)) + 1, Math.floor((L - h) / (h + g)) + 1];
}
function gridPlace(x0, y0, W, L, w, h, g, out, limitCols, limitRows) {
  let [c, r] = gridCount(W, L, w, h, g);
  if (limitCols !== undefined) c = Math.min(c, limitCols);
  if (limitRows !== undefined) r = Math.min(r, limitRows);
  for (let i = 0; i < r; i++)
    for (let j = 0; j < c; j++)
      out.push({ x: x0 + j * (w + g), y: y0 + i * (h + g), w, h });
  return c * r;
}
function bestGrid(x0, y0, W, L, orients, g) {
  let best = [];
  for (const [a, b] of orients) {
    const p = [];
    gridPlace(x0, y0, W, L, a, b, g, p);
    if (p.length > best.length) best = p;
  }
  return best;
}
function rectLayout(W, L, w, h, g, rotate, x0, y0) {
  const orients = [[w, h]];
  if (rotate && w !== h) orients.push([h, w]);
  let best = { parts: [], name: '' };
  const consider = (parts, name) => { if (parts.length > best.parts.length) best = { parts, name }; };
  for (const [a, b] of orients) {
    const p = [];
    gridPlace(x0, y0, W, L, a, b, g, p);
    consider(p, 'сетка');
  }
  for (const [a, b] of orients) {
    const [maxC, maxR] = gridCount(W, L, a, b, g);
    for (let k = 1; k < maxC; k++) {
      const p = [];
      gridPlace(x0, y0, W, L, a, b, g, p, k);
      const used = k * (a + g);
      p.push(...bestGrid(x0 + used, y0, W - used, L, orients, g));
      consider(p, 'комбинированная');
    }
    for (let k = 1; k < maxR; k++) {
      const p = [];
      gridPlace(x0, y0, W, L, a, b, g, p, undefined, k);
      const used = k * (b + g);
      p.push(...bestGrid(x0, y0 + used, W, L - used, orients, g));
      consider(p, 'комбинированная');
    }
  }
  return best;
}
function circleLayout(W, L, D, g, x0, y0) {
  const p = D + g;
  let best = { parts: [], name: '' };
  const consider = (parts, name) => { if (parts.length > best.parts.length) best = { parts, name }; };
  const sq = [];
  gridPlace(x0, y0, W, L, D, D, g, sq);
  consider(sq.map(r => ({ cx: r.x + D / 2, cy: r.y + D / 2, d: D })), 'ряды');
  const hex = (A, B, swap) => {
    const parts = [];
    if (A < D || B < D) return parts;
    const dy = p * Math.sqrt(3) / 2;
    const rows = Math.floor((B - D) / dy + 1e-9) + 1;
    const c0 = Math.floor((A - D) / p) + 1;
    const c1 = A >= D + p / 2 ? Math.floor((A - D - p / 2) / p) + 1 : 0;
    for (let i = 0; i < rows; i++) {
      const off = i % 2 ? p / 2 : 0;
      const n = i % 2 ? c1 : c0;
      for (let j = 0; j < n; j++) {
        const u = D / 2 + off + j * p, v = D / 2 + i * dy;
        parts.push(swap ? { cx: x0 + v, cy: y0 + u, d: D } : { cx: x0 + u, cy: y0 + v, d: D });
      }
    }
    return parts;
  };
  consider(hex(W, L, false), 'шахматная');
  consider(hex(L, W, true), 'шахматная');
  return best;
}

/* ---------- Разные детали на общих листах (MaxRects) ---------- */
function packMixed(T, AX, AY, G, E, rot) {
  const base = [];
  T.forEach(t => {
    const w = t.rect ? t.w : t.D, h = t.rect ? t.h : t.D;
    for (let i = 0; i < t.qty; i++) base.push({ k: t.k, w, h, circle: !t.rect });
  });
  // каждая деталь занимает ячейку (размер + отступ); лист условно увеличен на отступ
  const newBin = () => ({ free: [{ x: 0, y: 0, w: AX + G, h: AY + G }], placed: [] });

  const tryBin = (bin, it) => {
    let best = null;
    const opts = [[it.w, it.h]];
    if (rot && !it.circle && it.w !== it.h) opts.push([it.h, it.w]);
    for (const [w, h] of opts) {
      const iw = w + G, ih = h + G;
      for (const f of bin.free) {
        if (iw <= f.w && ih <= f.h) {
          const s1 = Math.min(f.w - iw, f.h - ih), s2 = Math.max(f.w - iw, f.h - ih);
          if (!best || s1 < best.s1 || (s1 === best.s1 && s2 < best.s2))
            best = { x: f.x, y: f.y, w: iw, h: ih, pw: w, ph: h, s1, s2 };
        }
      }
    }
    return best;
  };
  const commit = (bin, nd, it) => {
    bin.placed.push(it.circle
      ? { cx: E + nd.x + nd.pw / 2, cy: E + nd.y + nd.ph / 2, d: nd.pw, k: it.k }
      : { x: E + nd.x, y: E + nd.y, w: nd.pw, h: nd.ph, k: it.k });
    const u = nd, out = [];
    for (const f of bin.free) {
      if (u.x >= f.x + f.w || u.x + u.w <= f.x || u.y >= f.y + f.h || u.y + u.h <= f.y) { out.push(f); continue; }
      if (u.y > f.y) out.push({ x: f.x, y: f.y, w: f.w, h: u.y - f.y });
      if (u.y + u.h < f.y + f.h) out.push({ x: f.x, y: u.y + u.h, w: f.w, h: f.y + f.h - u.y - u.h });
      if (u.x > f.x) out.push({ x: f.x, y: f.y, w: u.x - f.x, h: f.h });
      if (u.x + u.w < f.x + f.w) out.push({ x: u.x + u.w, y: f.y, w: f.x + f.w - u.x - u.w, h: f.h });
    }
    bin.free = out.filter((a, i) => !out.some((b, j) => j !== i &&
      b.x <= a.x && b.y <= a.y && b.x + b.w >= a.x + a.w && b.y + b.h >= a.y + a.h &&
      (b.w * b.h > a.w * a.h || j < i)));
  };

  const sorts = [
    (a, b) => b.w * b.h - a.w * a.h,
    (a, b) => Math.max(b.w, b.h) - Math.max(a.w, a.h) || b.w * b.h - a.w * a.h,
    (a, b) => b.h - a.h || b.w - a.w
  ];
  let best = null;
  for (const s of sorts) {
    const items = base.slice().sort(s), bins = [];
    let ok = true;
    for (const it of items) {
      let placed = false;
      for (const b of bins) { const nd = tryBin(b, it); if (nd) { commit(b, nd, it); placed = true; break; } }
      if (!placed) {
        const b = newBin(), nd = tryBin(b, it);
        if (!nd) { ok = false; break; }
        commit(b, nd, it); bins.push(b);
      }
    }
    if (ok && (!best || bins.length < best.length)) best = bins;
  }
  return best ? best.map(b => b.placed) : null;
}

/* ---------- Рулон: ширина фиксирована, считаем длину ---------- */
function rollRect(AW, w, h, n, G, rot) {
  const opts = [[w, h]];
  if (rot && w !== h) opts.push([h, w]);
  let best = null;
  for (const [a, b] of opts) {
    if (a > AW) continue;
    const c = Math.floor((AW - a) / (a + G)) + 1;
    const rows = Math.ceil(n / c);
    const len = rows * b + (rows - 1) * G;
    if (!best || len < best.len) {
      best = { len, cols: String(c), name: 'ряды', gen: (x0, y0) => {
        const out = [];
        for (let i = 0; i < n; i++) {
          const row = Math.floor(i / c), col = i % c;
          out.push({ x: x0 + col * (a + G), y: y0 + row * (b + G), w: a, h: b });
        }
        return out;
      } };
    }
  }
  return best;
}
function rollCircle(AW, D, n, G) {
  if (D > AW) return null;
  const p = D + G, dy = p * Math.sqrt(3) / 2;
  const c0 = Math.floor((AW - D) / p) + 1;
  const c1 = AW >= D + p / 2 ? Math.floor((AW - D - p / 2) / p) + 1 : 0;
  const rowsSq = Math.ceil(n / c0);
  const lenSq = D + (rowsSq - 1) * p;
  let r = 1;
  const cap = k => Math.ceil(k / 2) * c0 + Math.floor(k / 2) * c1;
  if (c1 > 0) while (cap(r) < n) r++;
  const lenHex = D + (r - 1) * dy;
  if (c1 > 0 && lenHex < lenSq) {
    return { len: lenHex, cols: c0 === c1 ? String(c0) : `${c0}/${c1}`, name: 'шахматная', gen: (x0, y0) => {
      const out = [];
      let left = n;
      for (let i = 0; left > 0; i++) {
        const off = i % 2 ? p / 2 : 0, cnt = i % 2 ? c1 : c0;
        for (let j = 0; j < cnt && left > 0; j++, left--)
          out.push({ cx: x0 + D / 2 + off + j * p, cy: y0 + D / 2 + i * dy, d: D });
      }
      return out;
    } };
  }
  return { len: lenSq, cols: String(c0), name: 'ряды', gen: (x0, y0) => {
    const out = [];
    for (let i = 0; i < n; i++) {
      const row = Math.floor(i / c0), col = i % c0;
      out.push({ cx: x0 + D / 2 + col * p, cy: y0 + D / 2 + row * p, d: D });
    }
    return out;
  } };
}
/* в рулоне считаем по осям (поперёк, вдоль); для рисунка меняем местами, чтобы рулон лежал горизонтально */
const tr = p => p.d !== undefined
  ? { cx: p.cy, cy: p.cx, d: p.d, k: p.k }
  : { x: p.y, y: p.x, w: p.h, h: p.w, k: p.k };

/* =========================================================
   Интерфейс
   ========================================================= */
const $ = id => document.getElementById(id);
const num = id => { const v = parseFloat(String($(id).value).replace(',', '.')); return isFinite(v) ? v : NaN; };
const pf = s => parseFloat(String(s).replace(',', '.'));
const fmt = (v, d = 2) => v.toLocaleString('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: d });
const tile = (k, v, s, main) => `<div class="tile${main ? ' main' : ''}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;

let mode = 'sheet';
let nextId = 1;
let parts = [];
let lastResult = null;
let viewIdx = 0;

function newPart(shape = 'rect') {
  const color = COLORS.find(c => !parts.some(p => p.color === c)) || COLORS[parts.length % COLORS.length];
  return { id: nextId++, shape, l: '', w: '', d: '', qty: '', color };
}

/* --- стандартные размеры --- */
function renderChips() {
  const L = pf($('sheetL').value), W = pf($('sheetW').value);
  $('chips').innerHTML = SIZES.map(([a, b]) =>
    `<button type="button" class="chip ${(L === a && W === b) ? 'on' : ''}" data-a="${a}" data-b="${b}">${a} × ${b}</button>`).join('');
}
$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  $('sheetL').value = b.dataset.a; $('sheetW').value = b.dataset.b; calc();
});

/* --- режим лист / рулон --- */
function setMode(m) {
  mode = m;
  $('btnSheet').classList.toggle('on', m === 'sheet');
  $('btnRoll').classList.toggle('on', m === 'roll');
  $('lblL').classList.toggle('hidden', m === 'roll');
  $('chips').classList.toggle('hidden', m === 'roll');
  $('lblWt').textContent = m === 'roll' ? 'Ширина рулона' : 'Ширина';
  viewIdx = 0; calc();
}
$('btnSheet').onclick = () => setMode('sheet');
$('btnRoll').onclick = () => setMode('roll');

/* --- карточки деталей --- */
function renderParts() {
  $('parts').innerHTML = parts.map((p, i) => `
    <div class="partcard" data-id="${p.id}">
      <div class="parthead"><span class="swatch" style="background:${p.color}"></span><b>Деталь ${i + 1}</b>
        ${parts.length > 1 ? '<button type="button" class="x" data-act="del" title="Удалить">×</button>' : ''}</div>
      <div class="seg">
        <button type="button" data-act="shape" data-v="rect" class="${p.shape === 'rect' ? 'on' : ''}">Прямоугольник</button>
        <button type="button" data-act="shape" data-v="circle" class="${p.shape === 'circle' ? 'on' : ''}">Круг</button>
      </div>
      ${p.shape === 'rect'
        ? `<div class="row">
             <label>Длина, мм<input type="number" inputmode="decimal" min="0" step="any" data-f="l" value="${p.l}"></label>
             <label>Ширина, мм<input type="number" inputmode="decimal" min="0" step="any" data-f="w" value="${p.w}"></label>
           </div>`
        : `<label>Диаметр, мм<input type="number" inputmode="decimal" min="0" step="any" data-f="d" value="${p.d}"></label>`}
      <label style="margin-bottom:0">Количество, шт<input type="number" inputmode="numeric" min="1" step="1" data-f="qty" value="${p.qty}"></label>
    </div>`).join('');
}
$('parts').addEventListener('input', e => {
  const f = e.target.dataset.f; if (!f) return;
  const id = +e.target.closest('.partcard').dataset.id;
  parts.find(p => p.id === id)[f] = e.target.value;
  calc();
});
$('parts').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const id = +b.closest('.partcard').dataset.id;
  const i = parts.findIndex(p => p.id === id);
  if (b.dataset.act === 'del') parts.splice(i, 1);
  else parts[i].shape = b.dataset.v;
  renderParts(); calc();
});
$('addPart').onclick = () => {
  parts.push(newPart()); renderParts(); calc();
  const cards = $('parts').querySelectorAll('.partcard');
  const inp = cards[cards.length - 1].querySelector('input');
  inp.scrollIntoView({ block: 'nearest' }); inp.focus();
};

/* --- очистить: размер листа, размеры и количество деталей; остальное остаётся --- */
$('clearBtn').onclick = () => {
  $('sheetL').value = ''; $('sheetW').value = '';
  const shape = parts[0] ? parts[0].shape : 'rect';
  parts = []; parts.push(newPart(shape));
  viewIdx = 0; renderParts(); calc();
};

['sheetL', 'sheetW', 'edge', 'gap', 'rotate'].forEach(id => {
  $(id).addEventListener('input', calc);
  $(id).addEventListener('change', calc);
});

/* --- сообщения --- */
function showMsg(t, isErr, warn) {
  $('msg').textContent = t; $('msg').className = 'msg ' + (isErr ? 'err' : 'hint');
  $('svg').innerHTML = ''; $('svg').classList.add('hidden');
  $('totals').innerHTML = '<div class="empty">Здесь появится расчёт</div>'; $('tableBox').innerHTML = '';
  $('tabs').innerHTML = ''; $('layoutNote').textContent = ''; $('legend').innerHTML = '';
  $('warn').textContent = warn || '';
  lastResult = null;
}

/* =========================================================
   Главный расчёт
   ========================================================= */
function calc() {
  renderChips();
  const roll = mode === 'roll';

  // материал
  const need = roll ? ['sheetW'] : ['sheetL', 'sheetW'];
  for (const id of need)
    if ($(id).value !== '' && !(num(id) > 0)) return showMsg('Размеры материала должны быть больше нуля', true);
  const sheetMissing = need.some(id => $(id).value === '');
  const edge = $('edge').value === '' ? 0 : num('edge');
  const g = $('gap').value === '' ? NaN : num('gap');
  if (edge < 0) return showMsg('Отступ от края не может быть отрицательным', true);
  if (g < 0) return showMsg('Технический отступ не может быть отрицательным', true);

  // детали: незаполненные просто не учитываются, расчёт по готовым продолжается
  const act = [], skipped = [];
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    const raw = p.shape === 'rect' ? [p.l, p.w] : [p.d];
    if (raw.every(v => v === '') && p.qty === '') { if (parts.length > 1) skipped.push(i + 1); continue; }
    const sizes = raw.map(pf), q = pf(p.qty);
    if (sizes.some(v => isFinite(v) && v <= 0)) return showMsg(`Деталь ${i + 1}: размеры должны быть больше нуля`, true);
    if (isFinite(q) && (q < 1 || !Number.isInteger(q))) return showMsg(`Деталь ${i + 1}: количество — целое число от 1`, true);
    if (sizes.some(v => !isFinite(v)) || !isFinite(q)) { skipped.push(i + 1); continue; }
    act.push({ shape: p.shape, sizes, q, color: p.color, index: i });
  }
  const warn = skipped.length && act.length
    ? (skipped.length === 1 ? `Деталь ${skipped[0]} пока не учтена — заполните размер и количество.`
                            : `Детали ${skipped.join(', ')} пока не учтены — заполните размер и количество.`)
    : '';

  if (sheetMissing) return showMsg(roll ? 'Введите ширину рулона' : 'Введите длину и ширину листа', false);
  if (isNaN(g)) return showMsg('Введите технический отступ (0 — если не нужен)', false);
  if (!act.length) return showMsg('Введите размер детали и количество — здесь появится раскладка', false);

  const sL = roll ? 0 : num('sheetL'), sW = num('sheetW');
  const SX = toU(sL), SY = toU(sW), E = toU(edge), G = toU(g);
  const rot = $('rotate').checked;

  const T = act.map((a, k) => {
    const rect = a.shape === 'rect';
    const w = rect ? toU(a.sizes[0]) : 0, h = rect ? toU(a.sizes[1]) : 0, D = rect ? 0 : toU(a.sizes[0]);
    return {
      k, rect, w, h, D, qty: a.q, color: a.color, name: 'Деталь ' + (a.index + 1),
      size: rect ? `${fmt(a.sizes[0], 3)} × ${fmt(a.sizes[1], 3)} мм` : `Ø ${fmt(a.sizes[0], 3)} мм`,
      area: rect ? (w / U) * (h / U) : Math.PI * Math.pow(D / U, 2) / 4
    };
  });

  $('msg').className = 'msg hidden';
  $('svg').classList.remove('hidden');
  $('warn').textContent = warn;
  if (roll) calcRoll(T, SY, E, G, rot, sW, warn);
  else calcSheet(T, SX, SY, E, G, rot, sL, sW, warn);
}

/* ---------- ЛИСТ ---------- */
function calcSheet(T, SX, SY, E, G, rot, sL, sW, warn) {
  const AX = SX - 2 * E, AY = SY - 2 * E;
  if (AX <= 0 || AY <= 0) return showMsg('Отступ от края больше половины листа', true, warn);
  const sheetArea = (SX / U) * (SY / U);
  const multi = T.length > 1;

  const per = [];
  for (const t of T) {
    const res = t.rect ? rectLayout(AX, AY, t.w, t.h, G, rot, E, E) : circleLayout(AX, AY, t.D, G, E, E);
    if (!res.parts.length) return showMsg(`${t.name} не помещается на лист такого размера`, true, warn);
    const perSheet = res.parts.length;
    const sheets = Math.ceil(t.qty / perSheet);
    per.push({ t, res, perSheet, sheets, last: t.qty - (sheets - 1) * perSheet });
  }

  // каждый вид на своих листах
  let groups = [];
  per.forEach(r => {
    const tag = ps => ps.map(p => ({ ...p, k: r.t.k }));
    const pre = multi ? r.t.name + ': ' : '';
    const fullN = r.last === r.perSheet ? r.sheets : r.sheets - 1;
    if (fullN > 0) groups.push({
      parts: tag(r.res.parts),
      label: pre + (r.sheets === 1 ? 'лист' : fullN === 1 ? 'полный лист' : `полные листы ×${fullN}`) + ` · ${r.perSheet} шт`
    });
    if (r.last < r.perSheet) groups.push({
      parts: tag(r.res.parts.slice(0, r.last)),
      label: pre + (r.sheets === 1 ? 'лист' : 'последний лист') + ` · ${r.last} шт`
    });
  });
  const sumSep = per.reduce((s, r) => s + r.sheets, 0);

  // все виды вместе на общих листах
  let total = sumSep, together = false;
  if (multi && T.reduce((s, t) => s + t.qty, 0) <= 1500) {
    const mixed = packMixed(T, AX, AY, G, E, rot);
    if (mixed && mixed.length < sumSep) {
      total = mixed.length; together = true;
      groups = mixed.map((ps, i) => ({ parts: ps, label: `Лист ${i + 1} · ${ps.length} шт` }));
    }
  }

  const totalArea = sheetArea * total;
  const partsArea = T.reduce((s, t) => s + t.area * t.qty, 0);
  const waste = totalArea - partsArea;
  const sepArea = sheetArea * sumSep;
  const qtyAll = T.reduce((s, t) => s + t.qty, 0);

  let html = tile('Нужно листов', `${total} шт`,
    multi ? (together ? `вместе, на общих листах · ${fmt(sL, 3)} × ${fmt(sW, 3)} мм` : `каждый вид на своих листах · ${fmt(sL, 3)} × ${fmt(sW, 3)} мм`)
          : `лист ${fmt(sL, 3)} × ${fmt(sW, 3)} мм`, true);
  if (!multi) {
    const r = per[0];
    html += tile('Деталей на листе', `${r.perSheet} шт`, r.sheets > 1 && r.last !== r.perSheet ? `${r.sheets - 1} полн. + последний: ${r.last} шт` : `заказано: ${r.t.qty} шт`);
  } else {
    html += tile('Если резать отдельно', `${sumSep} шт`, `${fmt(sepArea / 1e6, 4)} м² · ${fmt(sepArea / 100, 2)} см²`);
  }
  html += tile('Площадь листов', `${fmt(totalArea / 1e6, 4)} м²`, `${fmt(totalArea / 100, 2)} см² · ${fmt(totalArea, 2)} мм²`, true);
  html += tile('Площадь деталей', `${fmt(partsArea / 1e6, 4)} м²`, `${fmt(partsArea / 100, 2)} см² · ${qtyAll} шт`);
  html += tile('Отход', `${fmt(waste / 1e6, 4)} м²`, `${fmt(waste / 100, 2)} см² · использование ${fmt(partsArea / totalArea * 100, 1)}%`);
  $('totals').innerHTML = html;

  if (multi) {
    const rows = per.map(r => `<tr>
      <td><span class="swatch" style="background:${r.t.color}"></span>${r.t.name}<small>${r.t.size}</small></td>
      <td>${r.t.qty}</td><td>${r.perSheet}</td><td>${r.sheets}</td></tr>`).join('');
    $('tableBox').innerHTML = `<table>
      <tr><th>Деталь</th><th>Шт</th><th>На листе</th><th>Листов</th></tr>
      ${rows}
      <tr class="sum"><td>Итого отдельно</td><td>${qtyAll}</td><td></td><td>${sumSep}</td></tr>
      <tr class="sum"><td>Итого вместе</td><td>${qtyAll}</td><td></td><td>${total}</td></tr>
    </table>`;
  } else $('tableBox').innerHTML = '';

  $('layoutNote').textContent = multi
    ? (together ? 'Детали разных видов размещены на общих листах (в общей раскладке круг занимает квадратную ячейку).'
                : 'Общая раскладка не дала экономии листов, поэтому показан раскрой каждого вида отдельно.')
    : `Схема: ${per[0].res.name}.`;

  lastResult = { groups, drawW: SX, drawH: SY, E, T, roll: false };
  finishRender();
}

/* ---------- РУЛОН ---------- */
function calcRoll(T, SY, E, G, rot, sW, warn) {
  const AW = SY - 2 * E;
  if (AW <= 0) return showMsg('Отступ от края больше половины ширины рулона', true, warn);
  const multi = T.length > 1;
  let y = E; const all = []; const infos = [];

  for (let i = 0; i < T.length; i++) {
    const t = T[i];
    const r = t.rect ? rollRect(AW, t.w, t.h, t.qty, G, rot) : rollCircle(AW, t.D, t.qty, G);
    if (!r) return showMsg(`${t.name} не помещается по ширине рулона`, true, warn);
    r.gen(E, y).forEach(p => all.push(tr({ ...p, k: t.k })));
    infos.push({ t, len: r.len, cols: r.cols, name: r.name });
    y += r.len + (i < T.length - 1 ? G : 0);
  }
  const totalLen = y + E;                       // мкм
  const rollArea = (SY / U) * (totalLen / U);   // мм²
  const partsArea = T.reduce((s, t) => s + t.area * t.qty, 0);
  const waste = rollArea - partsArea;
  const mp = totalLen / U / 1000;
  const qtyAll = T.reduce((s, t) => s + t.qty, 0);

  $('totals').innerHTML =
    tile('Нужно погонных метров', `${fmt(mp, 3)} м.п.`, `${fmt(totalLen / U, 1)} мм · ширина рулона ${fmt(sW, 3)} мм`, true) +
    tile('Площадь рулона', `${fmt(rollArea / 1e6, 4)} м²`, `${fmt(rollArea / 100, 2)} см² · ${fmt(rollArea, 2)} мм²`, true) +
    tile('Площадь деталей', `${fmt(partsArea / 1e6, 4)} м²`, `${fmt(partsArea / 100, 2)} см² · ${qtyAll} шт`) +
    tile('Отход', `${fmt(waste / 1e6, 4)} м²`, `${fmt(waste / 100, 2)} см² · использование ${fmt(partsArea / rollArea * 100, 1)}%`);

  if (multi) {
    const rows = infos.map(r => `<tr>
      <td><span class="swatch" style="background:${r.t.color}"></span>${r.t.name}<small>${r.t.size}</small></td>
      <td>${r.t.qty}</td><td>${r.cols}</td><td>${fmt(r.len / U / 1000, 3)}</td></tr>`).join('');
    $('tableBox').innerHTML = `<table>
      <tr><th>Деталь</th><th>Шт</th><th>В ряду</th><th>М.п.</th></tr>
      ${rows}
      <tr class="sum"><td>Итого вместе<small>с отступами</small></td><td>${qtyAll}</td><td></td><td>${fmt(mp, 3)}</td></tr>
    </table>`;
  } else $('tableBox').innerHTML = '';

  $('layoutNote').textContent = 'Рулон показан горизонтально. ' +
    (multi ? 'Каждый вид идёт своей полосой по длине рулона.' : `Схема: ${infos[0].name}, деталей в ряду: ${infos[0].cols}.`);

  lastResult = { groups: [{ parts: all, label: 'Рулон' }], drawW: totalLen, drawH: SY, E, T, roll: true };
  finishRender();
}

/* ---------- отрисовка ---------- */
function finishRender() {
  if (viewIdx >= lastResult.groups.length) viewIdx = 0;
  const T = lastResult.T;
  $('legend').innerHTML = T.length > 1
    ? T.map(t => `<span><span class="swatch" style="background:${t.color}"></span>${t.name}: ${t.size}</span>`).join('') : '';
  renderTabs(); draw();
}
function renderTabs() {
  const { groups } = lastResult, t = $('tabs');
  if (groups.length <= 1) { t.innerHTML = ''; return; }
  t.innerHTML = groups.map((g, i) => `<button type="button" data-i="${i}" class="${i === viewIdx ? 'on' : ''}">${g.label}</button>`).join('');
}
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !lastResult) return;
  viewIdx = +b.dataset.i; renderTabs(); draw();
});

function draw() {
  const R = lastResult, g = R.groups[viewIdx] || R.groups[0];
  const W = R.drawW / U, H = R.drawH / U;
  const base = Math.max(W, H);
  const fs = base * 0.022, pad = fs * 2.4;
  const sw = fs * 0.06;
  const s = [];
  s.push(`<rect x="0" y="0" width="${W}" height="${H}" fill="#eef1f5" stroke="#94a3b8" stroke-width="${fs * 0.12}"/>`);
  if (R.E > 0) {
    const e = R.E / U;
    s.push(`<rect x="${e}" y="${e}" width="${W - 2 * e}" height="${H - 2 * e}" fill="none" stroke="#cbd5e1" stroke-dasharray="${fs * 0.5}" stroke-width="${fs * 0.08}"/>`);
  }
  const shown = g.parts.length > MAXDRAW ? g.parts.slice(0, MAXDRAW) : g.parts;
  for (const p of shown) {
    const col = R.T[p.k].color;
    if (p.d !== undefined)
      s.push(`<circle cx="${p.cx / U}" cy="${p.cy / U}" r="${p.d / U / 2}" fill="${col}" fill-opacity=".75" stroke="rgba(15,23,42,.45)" stroke-width="${sw}"/>`);
    else
      s.push(`<rect x="${p.x / U}" y="${p.y / U}" width="${p.w / U}" height="${p.h / U}" fill="${col}" fill-opacity=".75" stroke="rgba(15,23,42,.45)" stroke-width="${sw}"/>`);
  }
  const topLabel = R.roll ? `${fmt(W / 1000, 3)} м.п.` : `${fmt(W, 3)} мм`;
  s.push(`<text x="${W / 2}" y="${-pad * 0.35}" font-size="${fs}" text-anchor="middle" fill="#475569">${topLabel}</text>`);
  s.push(`<text x="${-pad * 0.35}" y="${H / 2}" font-size="${fs}" text-anchor="middle" fill="#475569" transform="rotate(-90 ${-pad * 0.35} ${H / 2})">${fmt(H, 3)} мм</text>`);
  const svg = $('svg');
  svg.setAttribute('viewBox', `${-pad} ${-pad} ${W + pad * 1.4} ${H + pad * 1.4}`);
  svg.innerHTML = s.join('');
  if (g.parts.length > MAXDRAW) $('layoutNote').textContent += ` На рисунке показаны первые ${MAXDRAW} деталей из ${g.parts.length}, расчёт учитывает все.`;
}

/* ---------- старт: всё пустое ---------- */
parts = [newPart()];
renderParts();
setMode('sheet');
</script>
</body>
</html>
